[project]
name = "rigol-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents read and control Rigol DS1000Z oscilloscopes over the network"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Lucas Hohmann" }]
keywords = ["mcp", "oscilloscope", "rigol", "scpi", "lxi", "claude", "test-equipment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: System :: Hardware",
]
dependencies = ["mcp>=1.10,<2", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/lfhohmann/rigol-mcp"
Issues = "https://github.com/lfhohmann/rigol-mcp/issues"

[project.scripts]
rigol-mcp = "rigol_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
